[package]
name = "rzx"
version = "0.1.0"
edition = "2021"
authors = ["Nurul Fajar <nurulfajar@protonmail.com>"]
description = "A modern, fast compression tool with .rzx format support"
license = "MIT"
readme = "README.md"
repository = "https://github.com/newjar/rzx"
keywords = ["compression", "archive", "cli"]
categories = ["command-line-utilities", "compression"]

[lib]
name = "rzx"
path = "src/lib.rs"

[dependencies]
# CLI framework
clap = { version = "4.4", features = ["derive", "color"] }

# Compression libraries
flate2 = "1.0"
lzma-rs = "0.3"
zstd = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Concurrency
rayon = "1.8"

# Encryption
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.11"
rand = { version = "0.8", features = ["std"] }
sha2 = "0.10"

# Progress bars
indicatif = "0.17"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File handling
walkdir = "2.4"
filetime = "0.2"

# Checksums
crc32fast = "1.3"

# Logging
log = "0.4"
env_logger = "0.10"

# Cross-platform support
crossbeam = "0.8"

[dev-dependencies]
# Testing
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[[bench]]
name = "compression_benchmark"
harness = false
